# Local development stack. Start with:  docker compose up -d --build
# Every service reads its settings from the .env file (copy .env.example first).

x-backend: &backend
  build: ./backend
  env_file: .env
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible file storage for local development (SeaweedFS).
  # Production uses OCI Object Storage through the same S3 API; only env vars change.
  storage:
    image: chrislusf/seaweedfs
    entrypoint: >
      /bin/sh -c "
      printf '%s' '{\"identities\":[
        {\"name\":\"app\",\"credentials\":[{\"accessKey\":\"${S3_ACCESS_KEY}\",\"secretKey\":\"${S3_SECRET_KEY}\"}],
         \"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]},
        {\"name\":\"anonymous\",\"actions\":[\"Read:${S3_BUCKET}\"]}
      ]}' > /tmp/s3.json &&
      exec weed server -dir=/data -ip=storage -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
      "
    ports:
      - "8333:8333"
    volumes:
      - storage_data:/data

  # One-shot job: creates the media bucket, then exits.
  storage-init:
    image: chrislusf/seaweedfs
    depends_on:
      - storage
    entrypoint: >
      /bin/sh -c "
      until echo 's3.bucket.list' | weed shell -master=storage:9333 >/dev/null 2>&1; do sleep 1; done;
      echo 's3.bucket.list' | weed shell -master=storage:9333 | grep -q ${S3_BUCKET} ||
      echo 's3.bucket.create -name ${S3_BUCKET}' | weed shell -master=storage:9333;
      echo 'bucket ready: ${S3_BUCKET}'
      "

  imgproxy:
    image: darthsim/imgproxy
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: ${S3_ENDPOINT_URL}
      IMGPROXY_S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "8081:8080"
    depends_on:
      - storage

  api:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker -l info

  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  web:
    build: ./frontend
    env_file: .env
    environment:
      # Makes file-change detection work on Windows/macOS bind mounts.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
  storage_data:
