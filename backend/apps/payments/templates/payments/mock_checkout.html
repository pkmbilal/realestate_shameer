<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock checkout</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f1f5f9; margin: 0; padding: 16px; }
    .card { max-width: 420px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .warn { background: #fef3c7; color: #92400e; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
    .amount { font-size: 32px; font-weight: 700; margin: 16px 0 4px; }
    .row { display: flex; gap: 12px; margin-top: 24px; }
    button { flex: 1; padding: 12px; border: 0; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .pay { background: #059669; color: #fff; }
    .fail { background: #e2e8f0; color: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <p class="warn">Test payment page (INTEGRATIONS_MODE=mock). No money is taken.</p>
    <p class="amount">SAR {{ sar }}</p>
    <p>{{ state.description }}</p>
    <form method="post" class="row">
      {% csrf_token %}
      <button class="pay" name="outcome" value="pay" type="submit">Pay</button>
      <button class="fail" name="outcome" value="fail" type="submit">Fail</button>
    </form>
  </div>
</body>
</html>
